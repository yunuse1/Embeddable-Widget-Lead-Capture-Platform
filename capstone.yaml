name: flyrank-capstone-widget-platform
version: "1.0"
language: python
framework: fastapi
run: docker compose up --build
test: docker compose exec api python -m pytest -q
base_url: http://localhost:8000
endpoints:
  - path: /health
    method: GET
  - path: /widgets
    method: GET|POST
  - path: /widgets/{widget_id}
    method: GET|PATCH|DELETE
  - path: /public/widgets/{public_id}/config
    method: GET
  - path: /public/widgets/{public_id}/embed
    method: GET
  - path: /public/widget/v1/widget.js
    method: GET
  - path: /public/widgets/{public_id}/submissions
    method: POST
  - path: /dashboard/submissions
    method: GET
  - path: /dashboard/stats
    method: GET
  - path: /dashboard/geo
    method: GET
