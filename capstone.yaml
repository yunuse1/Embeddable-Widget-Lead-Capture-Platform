name: embeddable-widget-lead-capture-platform
version: "1.0"
run: docker compose up --build
test: docker compose exec api python -m pytest -q
base_url: http://localhost:8000
endpoints:
  health: GET /health
  register: POST /auth/register
  login: POST /auth/login
  widgets: GET|POST /widgets
  widget: GET|PATCH|DELETE /widgets/{widget_id}
  widget_config: GET /public/widgets/{public_id}/config
  embed: GET /public/widgets/{public_id}/embed
  widget_js: GET /public/widget/v1/widget.js
  submissions: POST /public/widgets/{public_id}/submissions
  dashboard_submissions: GET /dashboard/submissions
  dashboard_stats: GET /dashboard/stats
  dashboard_geo: GET /dashboard/geo
