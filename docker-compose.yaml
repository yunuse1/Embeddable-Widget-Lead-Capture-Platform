services:
  postgres:
    image: postgres:16
    container_name: lead-capture-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lead_capture
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lead_capture"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    container_name: lead-capture-migrate
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lead_capture
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    container_name: lead-capture-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lead_capture
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    container_name: lead-capture-worker
    command: python -m app.services.notification_worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lead_capture
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
